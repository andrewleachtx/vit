[project]
name = "vit"
version = "0.2.0"
description = "A CLI tool for attaching visuals to git commits."
readme = "README.md"
authors = [
    { name = "Andrew Leach" }
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
vit = "vit.cli:main"
